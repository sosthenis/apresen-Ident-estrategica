const cfg=Object.assign({databaseURL:'',apiKey:'',presenterUid:'',namespace:'tic_seminario_2026',publicURL:''},window.TIC_VOTE_CONFIG||{});
const safe={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={manual:safe.get('tic_manual',[0,0]),remote:[0,0],phase:'ask',round:null,opened:false,live:false,auth:null,status:'Contagem manual disponível.',voted:null,busy:false};
const dialog=document.createElement('dialog');dialog.id='ticPoll';dialog.setAttribute('aria-label','Votação: Países Baixos');document.body.append(dialog);let previousFocus=null,pollTimer=null,pollInFlight=false;
function total(){return state.manual.map((v,i)=>v+state.remote[i])}
function voterURL(){if(!cfg.publicURL)return '';try{const u=new URL(cfg.publicURL);if(!['https:','http:'].includes(u.protocol))return '';u.searchParams.set('votar','1');u.hash='';return u.href}catch{return ''}}
function qr(text){if(!text||typeof qrcode!=='function')return '';const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount();let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+4} ${r+4}h1v1h-1z`;return `<svg role="img" aria-label="QR code para votar" viewBox="0 0 ${n+8} ${n+8}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="white"/><path d="${d}" fill="#082645"/></svg>`}
function setup(){return `<details class="tp-setup"><summary>Acesso do apresentador</summary><p class="tp-hint">Importe o arquivo privado de acesso fornecido com a apresentação. Os participantes usam somente o QR code.</p><label>Arquivo de acesso do apresentador<input id="tpCredential" type="file" accept=".json,application/json"></label><div class="tp-actions"><button data-act="connect" class="tp-primary">Conectar e abrir votação</button></div></details>`}function render(){const values=total(),sum=values.reduce((a,b)=>a+b,0),revealed=state.phase==='revealed',url=voterURL();dialog.innerHTML=`<header class="tp-head"><div><p class="tp-kicker">CAPÍTULO 4.1 · VOTAÇÃO · PAÍSES BAIXOS</p><h2>${Q}</h2></div>${!audience&&state.live&&url?`<div class="tp-qr">${qr(url)}Escaneie para votar</div>`:''}<button class="tp-close" data-act="close" aria-label="Fechar votação">✕</button></header><img class="tp-map" src="${map}" alt="Dois mapas de probabilidade de inundação de 50 cm nos Países Baixos: mapa (a) à esquerda e mapa (b) à direita, com a legenda original."><div class="tp-grid">${choices.map((choice,i)=>`<div><button type="button" class="tp-option ${audience&&state.voted===i?'tp-selected':''}" data-choice="${i}" ${audience&&(!state.live||state.phase!=='ask'||state.busy)?'disabled':''}><span class="tp-letter">${'AB'[i]}</span><span class="tp-choice">${choice}</span><span class="tp-count">${audience?'':revealed?(sum?Math.round(values[i]/sum*100):0)+'%':values[i]}</span><span class="tp-bar" style="width:${!audience&&revealed&&sum?values[i]/sum*100:0}%"></span></button>${!audience&&!revealed?`<div class="tp-pm"><button aria-label="Retirar voto ${'AB'[i]}" data-adjust="${i}:-1">−</button><button aria-label="Adicionar voto ${'AB'[i]}" data-adjust="${i}:1">+</button></div>`:''}</div>`).join('')}</div><div class="tp-actions"><span class="tp-status" role="status">${esc(state.status)}</span>${!audience?`<button data-act="reset">Zerar / nova rodada</button><button data-act="reveal" class="tp-primary">${revealed?'Reabrir votação':'Revelar resultados'}</button>`:''}</div>${!audience?`<p class="tp-hint">Manual: A ou B adiciona um voto; Shift + A/B retira. Enter revela. ${revealed?`Total: ${sum} voto(s). A comparação dos mapas será discutida pelo apresentador.`:'Escolha o mapa atual; o outro corresponde à projeção para 2050.'}</p>${state.live&&url?`<p><a class="tp-link" target="_blank" rel="noopener" href="${esc(url)}">Abrir página de votação no celular</a></p>`:''}${setup()}`:`<p class="tp-hint">${state.phase==='ask'?'Toque em A ou B. Seu voto pode ser alterado enquanto a rodada estiver aberta.':'Votação encerrada. Aguarde a próxima rodada.'}</p>`}`;}
function setStatus(text){state.status=text;const el=dialog.querySelector('.tp-status');if(el)el.textContent=text}
async function authCall(action,body){const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+action+'?key='+encodeURIComponent(cfg.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error?.message||'Falha na autenticação');return d}
function rememberAuth(d){state.auth={token:d.idToken,refresh:d.refreshToken,uid:d.localId,expires:Date.now()+Number(d.expiresIn||3600)*1000};if(audience)safe.set('tic_auth_'+cfg.databaseURL,state.auth)}
async function token(){if(!state.auth)throw Error('Conecte o apresentador primeiro.');if(state.auth.expires-Date.now()<60000){const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(cfg.apiKey),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'refresh_token',refresh_token:state.auth.refresh})});const d=await r.json();if(!r.ok)throw Error('Sessão expirada. Conecte novamente.');rememberAuth({idToken:d.id_token,refreshToken:d.refresh_token,localId:d.user_id,expiresIn:d.expires_in})}return state.auth.token}
function validConfig(){const u=new URL(cfg.databaseURL);if(u.protocol!=='https:'||!/(^|\.)(firebaseio\.com|firebasedatabase\.app)$/.test(u.hostname)||u.pathname!=='/')throw Error('Informe a URL raiz HTTPS do Firebase.');if(!cfg.apiKey||!cfg.presenterUid)throw Error('Preencha apiKey e UID do apresentador.');if(!/^[a-zA-Z0-9_-]+$/.test(cfg.namespace))throw Error('Área da votação inválida.')}
async function db(part,method='GET',data){validConfig();const root=cfg.databaseURL.replace(/\/$/,'');const response=await fetch(root+'/'+cfg.namespace+'/'+part+'.json?auth='+encodeURIComponent(await token()),{method,cache:'no-store',...(method==='GET'?{}:{headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})});if(!response.ok)throw Error(response.status===401||response.status===403?'Acesso negado pelo Firebase. Confira autenticação, UID e regras.':'Falha ao acessar o banco ('+response.status+').');return response.json()}
async function publish(){if(!state.live)return;await db('current','PUT',{round:state.round,phase:state.phase,q:Q,updatedAt:Date.now()})}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(()=>{if(state.live&&!document.hidden&&!pollInFlight){pollInFlight=true;sync().catch(e=>setStatus(e.message)).finally(()=>{pollInFlight=false})}},2000)}
async function sync(){if(state.busy)return;if(audience){const current=await db('current');if(!current?.round){state.phase='waiting';state.status='Aguardando o apresentador abrir uma rodada.';render();return}const changed=current.round!==state.round||current.phase!==state.phase;state.round=current.round;state.phase=current.phase;if(changed){const own=await db('rounds/'+state.round+'/votes/'+state.auth.uid);state.voted=own?.choice??null;state.status=state.phase==='ask'?(state.voted===null?'Votação aberta. Escolha A ou B.':'Voto registrado. Você pode alterar sua escolha.'):'Votação encerrada.';render()}}else{const votes=await db('rounds/'+state.round+'/votes');const counts=[0,0];Object.values(votes||{}).forEach(v=>{if(v?.choice===0||v?.choice===1)counts[v.choice]++});state.remote=counts;const next='AO VIVO · '+counts.reduce((a,b)=>a+b,0)+' pelo celular';if(!dialog.querySelector('.tp-setup[open]')){state.status=next;render()}else setStatus(next)}}
async function connect(){setStatus("Conectando apresentador…");validConfig();const file=dialog.querySelector('#tpCredential').files[0];if(file){const access=JSON.parse(await file.text());if(access.uid!==cfg.presenterUid||access.databaseURL!==cfg.databaseURL)throw Error('Este arquivo não pertence ao apresentador desta votação.');state.auth={token:'',refresh:access.refreshToken,uid:access.uid,expires:0};await token()}else if(!state.auth)throw Error('Selecione seu arquivo privado de acesso.');if(state.auth.uid!==cfg.presenterUid)throw Error('Apresentador não autorizado.');state.round='r_'+crypto.randomUUID().replace(/-/g,'');state.phase='ask';state.remote=[0,0];state.live=true;try{await publish();state.status='AO VIVO · aguardando votos pelo celular';render();startPolling();try{await sync()}catch(e){setStatus('Conectado. Tentando atualizar a contagem…')}}catch(e){state.live=false;throw e}}async function reset(){if(state.live){const round='r_'+crypto.randomUUID().replace(/-/g,'');await db('current','PUT',{round,phase:'ask',q:Q,updatedAt:Date.now()});state.round=round}state.manual=[0,0];state.remote=[0,0];state.phase='ask';safe.set('tic_manual',state.manual);render()}
function add(i,d){if(audience||state.phase!=='ask')return;state.manual[i]=Math.max(0,state.manual[i]+d);safe.set('tic_manual',state.manual);render()}
async function vote(i){if(!state.live||state.phase!=='ask'||state.busy)return;state.busy=true;setStatus('Registrando voto…');try{await db('rounds/'+state.round+'/votes/'+state.auth.uid,'PUT',{choice:i,updatedAt:Date.now()});state.voted=i;state.status='Voto registrado. Você pode alterar sua escolha.'}catch(e){state.status=e.message}finally{state.busy=false;render()}}
async function close(){if(audience)return;if(state.live){try{await db('current','PUT',{round:state.round,phase:'closed',q:Q,updatedAt:Date.now()});state.phase='closed'}catch(e){setStatus('Não foi possível encerrar no banco. '+e.message);return}}clearInterval(pollTimer);state.live=false;dialog.close();state.opened=false;previousFocus?.focus()}
function open(){if(!state.live)state.phase='ask';previousFocus=document.activeElement;state.opened=true;render();dialog.showModal();dialog.querySelector('.tp-close')?.focus()}
dialog.addEventListener('cancel',e=>{e.preventDefault();close()});dialog.addEventListener('click',async e=>{const adjust=e.target.closest('[data-adjust]'),choice=e.target.closest('[data-choice]'),action=e.target.closest('[data-act]');try{if(adjust){const [i,d]=adjust.dataset.adjust.split(':').map(Number);add(i,d)}else if(choice){audience?await vote(+choice.dataset.choice):add(+choice.dataset.choice,1)}else if(action){switch(action.dataset.act){case'close':await close();break;case'reset':await reset();break;case'reveal':{const next=state.phase==='revealed'?'ask':'revealed';if(state.live)await db('current','PUT',{round:state.round,phase:next,q:Q,updatedAt:Date.now()});state.phase=next;render();break}case'connect':await connect();break;}}}catch(err){setStatus(err.message)}});
document.addEventListener('keydown',e=>{if(!dialog.open||audience)return;if(e.target.matches('input,textarea,select'))return;e.stopImmediatePropagation();if(['a','b'].includes(e.key.toLowerCase())){e.preventDefault();add(e.key.toLowerCase()==='a'?0:1,e.shiftKey?-1:1)}else if(e.key==='Enter'){e.preventDefault();dialog.querySelector('[data-act="reveal"]').click()}else if(e.key==='Escape'){e.preventDefault();close()}},{capture:true});
document.getElementById('ticOpenPoll')?.addEventListener('click',open);
const frame=document.getElementById('ticCover');if(frame){const coverSlide=frame.closest('.slide');function coverSync(){frame.contentWindow?.postMessage({type:'cover-active',active:coverSlide.classList.contains('active')},'*')}new MutationObserver(coverSync).observe(coverSlide,{attributes:true,attributeFilter:['class']});frame.addEventListener('load',coverSync);window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.data?.type!=='cover-key')return;const keys={ArrowRight:1,PageDown:1,ArrowLeft:-1,PageUp:-1};if(e.data.key in keys)show(current+keys[e.data.key]);else if(e.data.key==='Home')show(0);else if(e.data.key==='End')show(44)});coverSync();}
if(audience){document.body.classList.add('tic-audience');state.phase='waiting';state.status='Conectando à votação…';render();dialog.show();(async()=>{try{validConfig();state.auth=safe.get('tic_auth_'+cfg.databaseURL,null);if(!state.auth){rememberAuth(await authCall('signUp',{returnSecureToken:true}))}else await token();state.live=true;await sync();startPolling()}catch(e){state.live=false;state.status='Votação por celular ainda não configurada. '+e.message;render()}})()}
window.TICPoll={open,state,cfg,total};
})();</script><script>document.getElementById("ticOpenPoll").click();</script></body></html>
