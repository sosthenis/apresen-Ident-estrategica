<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Votação · Seminário TIC</title>
<style>
html,body{margin:0;background:#082645;color:#fff;font:500 20px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#aud{max-width:640px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px 40px}
h1{font:800 34px system-ui,sans-serif;text-transform:uppercase;color:#6fe3dc;margin:0 0 10px}
#aq{font:700 24px/1.25 system-ui,sans-serif;margin:0 0 18px}
#ao button{display:block;width:100%;margin:0 0 12px;padding:18px;border-radius:18px;border:2px solid #ffffff55;background:#ffffff14;color:#fff;font:600 21px/1.25 system-ui,sans-serif;text-align:left}
#ao button.sel{background:#00a3a3;border-color:#7cf0e6}
#ao button:disabled{opacity:.6}
#as{color:#9cc3d6;font-size:16px;min-height:1.4em}
</style>
</head>
<body>
<main id="aud"><h1>Votação</h1><p id="aq">Conectando…</p><div id="ao"></div><p id="as" role="status"></p></main>
<script>
window.TIC_VOTE_CONFIG = { "fb": "https://id-estrategica-default-rtdb.firebaseio.com" };
</script>
<script>
(()=>{'use strict';
const base=String((window.TIC_VOTE_CONFIG||{}).fb||'').replace(/\/+$/,''),$=s=>document.querySelector(s);
if(!/^https:\/\/[^/]+\.(firebaseio\.com|firebasedatabase\.app)/.test(base)){$('#aq').textContent='Votação indisponível neste acesso.';return}
let uid=null;try{uid=localStorage.getItem('tic_uid')}catch{}
if(!uid){uid='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{localStorage.setItem('tic_uid',uid)}catch{}}
const url=p=>base+'/'+p+'.json';
async function get(p){const r=await fetch(url(p),{cache:'no-store'});if(!r.ok)throw 0;return r.json()}
let cur=null,mine={},lastPid,busy=false;
function render(){const q=$('#aq'),o=$('#ao');o.textContent='';
 if(!cur||!cur.pid){q.textContent='Aguardando a próxima pergunta…';return}
 q.textContent=cur.q||'';const open=cur.phase==='ask';
 (cur.opts||[]).forEach((txt,i)=>{const b=document.createElement('button');b.type='button';b.disabled=!open;if(mine[cur.pid]===i)b.className='sel';
  const l=document.createElement('b');l.textContent='ABCDEF'[i]+' · ';b.append(l,document.createTextNode(txt));b.onclick=()=>vote(i);o.append(b)});
 $('#as').textContent=open?(mine[cur.pid]===undefined?'':'Voto registrado. Você pode mudar até o apresentador revelar.'):'Votação encerrada. Aguarde a próxima rodada.'}
async function vote(k){if(!cur||!cur.pid||cur.phase!=='ask'||busy)return;const pid=cur.pid;busy=true;const prev=mine[pid];mine={...mine,[pid]:k};render();
 try{const r=await fetch(url('votes/'+uid+'/'+pid),{method:'PUT',body:JSON.stringify(k)});if(!r.ok)throw 0;$('#as').textContent='Voto registrado. Você pode mudar até o apresentador revelar.'}
 catch{mine={...mine,[pid]:prev};render();$('#as').textContent='Não foi possível registrar o voto. Verifique a conexão e tente de novo.'}busy=false}
async function tick(){try{const c=await get('live/current');cur=c;
  if(cur&&cur.pid&&cur.pid!==lastPid){lastPid=cur.pid;try{mine=(await get('votes/'+uid))||{}}catch{}}
  if(!busy)render()}catch{$('#as').textContent='Sem conexão. Tentando de novo…'}}
tick();setInterval(tick,2000);
})();
</script>
</body>
</html>
